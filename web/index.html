<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>headset-eq — Almide-designed EQ for CY-P5GMWHS</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
         background: #0e1116; color: #d6deeb; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8a99b3; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  button { font: inherit; background: #1b2330; color: #d6deeb; border: 1px solid #303c52;
           border-radius: 7px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: #5a7bd6; }
  button.big { background: #2f4f7f; border-color: #4a7bd6; font-weight: bold; }
  button.on { background: #2f6f4f; border-color: #43a06f; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #log { background: #11161f; border: 1px solid #283246; border-radius: 8px; padding: 10px 12px;
         white-space: pre-wrap; max-width: 760px; min-height: 90px; font-size: 12px; color: #b9c6df; }
  .err { color: #ff8c8c; }
  .ok { color: #7fe0a0; }
  canvas { width: 100%; max-width: 760px; height: 220px; background: #11161f;
           border: 1px solid #283246; border-radius: 8px; display: block; margin: 14px 0; }
  table { border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { border: 1px solid #283246; padding: 3px 9px; text-align: right; }
  th { color: #8a99b3; font-weight: normal; }
  code { color: #9cdcfe; } .tag { color: #c586c0; }
  hr { border: 0; border-top: 1px solid #283246; margin: 18px 0; }
</style>
</head>
<body>
  <h1>headset-eq <span class="tag">// Almide-designed parametric EQ</span></h1>
  <p class="sub">CYBER <code>CY-P5GMWHS</code> 補正カーブ。診断のため、まず <b>STEP 1</b> を試してください。</p>

  <div class="row">
    <b>STEP 1 — 音が出るかの確認:</b>
    <button id="beep" class="big">🔊 ビープテスト(純WebAudio・EQ/wasm非経由)</button>
  </div>
  <div class="row">
    <b>STEP 2 — Almide EQ:</b>
    <button id="tone">▶ 1kHz トーン</button>
    <button id="noise">▶ ピンクノイズ</button>
    <label><button id="pick">▶ 音声ファイル…</button><input id="file" type="file" accept="audio/*" hidden></label>
    <button id="stop" disabled>■ 停止</button>
    <button id="eq" class="on">EQ: ON</button>
  </div>

  <div id="log">log:</div>

  <hr>
  <canvas id="plot" width="1520" height="440"></canvas>
  <div id="coeffs"></div>

<script type="module">
const WASM_URL = '../dist/headset_eq.wasm';
const $ = s => document.querySelector(s);
const logEl = $('#log');
function log(msg, cls='') { const d = document.createElement('div'); if (cls) d.className = cls;
  d.textContent = msg; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; console.log(msg); }

window.addEventListener('error', e => log('window error: ' + (e.message || e), 'err'));
window.addEventListener('unhandledrejection', e => log('promise rejection: ' + ((e.reason && e.reason.message) || e.reason), 'err'));

let coeffs = [], ctx = null, source = null, eqOn = true;

async function resumeCtx() {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)();
    log(`AudioContext 作成: sampleRate=${ctx.sampleRate}, maxChannels=${ctx.destination.maxChannelCount}`); }
  log(`ctx.state(before resume) = ${ctx.state}`);
  if (ctx.state !== 'running') { await ctx.resume(); }
  log(`ctx.state(after resume)  = ${ctx.state}`, ctx.state === 'running' ? 'ok' : 'err');
  return ctx;
}

function stop() {
  if (source) {
    if (source._osc) { try { source._osc.stop(); } catch (_) {} }
    try { source.stop(); } catch (_) {}
    try { source.disconnect(); } catch (_) {}
    source = null;
  }
  $('#stop').disabled = true;
}

// ── STEP 1: absolutely minimal path. If this is silent, the problem is the
//    browser tab mute / OS output device / volume — not the EQ code. ──
async function beep() {
  try {
    await resumeCtx(); stop();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = 440; g.gain.value = 0.25;
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 1.0);
    log('▶ 440Hz を 1秒 鳴らしました(osc → gain → destination)。聞こえましたか?', 'ok');
  } catch (e) { log('beep error: ' + e.message, 'err'); }
}

// ── STEP 2: the Almide EQ ──
function buildChain(ac) {
  return coeffs.map(c => new IIRFilterNode(ac, { feedforward: [c.b0, c.b1, c.b2], feedback: [1.0, c.a1, c.a2] }));
}
function connectGraph(node) {
  if (eqOn && coeffs.length) {
    const chain = buildChain(ctx);
    node.connect(chain[0]);
    for (let i = 0; i < chain.length - 1; i++) chain[i].connect(chain[i + 1]);
    chain[chain.length - 1].connect(ctx.destination);
    log(`graph: source → [${chain.length} band EQ] → out`);
  } else { node.connect(ctx.destination); log('graph: source → out (EQ bypass)'); }
}

async function playTone() {
  try {
    await resumeCtx(); stop();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 1000; g.gain.value = 0.25;
    osc.connect(g); source = g; source._osc = osc; connectGraph(g); osc.start();
    $('#stop').disabled = false; log('▶ 1kHz トーン 再生中', 'ok');
  } catch (e) { log('tone error: ' + e.message, 'err'); }
}

async function playNoise() {
  try {
    await resumeCtx(); stop();
    const sr = ctx.sampleRate, buf = ctx.createBuffer(1, sr * 4, sr), d = buf.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for (let i=0;i<d.length;i++){ const w=Math.random()*2-1; b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164; b2=0.57000*b2+w*1.0526913; d[i]=(b0+b1+b2+w*0.1848)*0.15; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    source = src; connectGraph(src); src.start();
    $('#stop').disabled = false; log('▶ ピンクノイズ 再生中', 'ok');
  } catch (e) { log('noise error: ' + e.message, 'err'); }
}

async function playFile(file) {
  try {
    await resumeCtx(); stop();
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    source = src; connectGraph(src); src.start();
    $('#stop').disabled = false; log(`▶ ${file.name} 再生中 (ループ)`, 'ok');
  } catch (e) { log('file error: ' + e.message, 'err'); }
}

function drawResponse() {
  try {
    const cv = $('#plot'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
    g.fillStyle = '#11161f'; g.fillRect(0,0,W,H);
    const N = 480, f0 = 20, f1 = 20000, freqs = new Float32Array(N);
    for (let i=0;i<N;i++) freqs[i] = f0 * Math.pow(f1/f0, i/(N-1));
    const total = new Float32Array(N).fill(1);
    const ac = new OfflineAudioContext(1, 1, 48000);
    for (const c of coeffs) {
      const iir = new IIRFilterNode(ac, { feedforward:[c.b0,c.b1,c.b2], feedback:[1,c.a1,c.a2] });
      const mag = new Float32Array(N), ph = new Float32Array(N);
      iir.getFrequencyResponse(freqs, mag, ph);
      for (let i=0;i<N;i++) total[i] *= mag[i];
    }
    const dbMin=-8, dbMax=4, x=i=>(i/(N-1))*W, y=db=>H-((db-dbMin)/(dbMax-dbMin))*H;
    g.strokeStyle='#283246'; g.lineWidth=1; g.font='20px monospace';
    for (const db of [-6,-4,-2,0,2,4]){ g.beginPath(); g.moveTo(0,y(db)); g.lineTo(W,y(db)); g.stroke(); g.fillStyle='#5b6b85'; g.fillText(db+' dB',6,y(db)-4); }
    for (const f of [100,1000,10000]){ const i=(Math.log(f/f0)/Math.log(f1/f0))*(N-1); g.beginPath(); g.moveTo(x(i),0); g.lineTo(x(i),H); g.stroke(); g.fillText((f>=1000?f/1000+'k':f)+'Hz',x(i)+4,H-8); }
    g.strokeStyle='#5a7bd6'; g.lineWidth=3; g.beginPath();
    for (let i=0;i<N;i++){ const db=20*Math.log10(total[i]); i?g.lineTo(x(i),y(db)):g.moveTo(x(i),y(db)); }
    g.stroke();
  } catch (e) { log('plot error: ' + e.message, 'err'); }
}

function showCoeffs() {
  const fr=[125,250,1000,2000,4000,8000,16000], gn=[-2.5,-2,1.5,1.5,-1,1,1];
  let h='<table><tr><th>band</th><th>freq</th><th>gain</th><th>b0</th><th>b1</th><th>b2</th><th>a1</th><th>a2</th></tr>';
  coeffs.forEach((c,i)=>{ h+=`<tr><td>${i}</td><td>${fr[i]} Hz</td><td>${gn[i]>0?'+':''}${gn[i]} dB</td><td>${c.b0.toFixed(4)}</td><td>${c.b1.toFixed(4)}</td><td>${c.b2.toFixed(4)}</td><td>${c.a1.toFixed(4)}</td><td>${c.a2.toFixed(4)}</td></tr>`; });
  $('#coeffs').innerHTML = h + '</table>';
}

async function loadCoeffs() {
  const res = await fetch(WASM_URL);
  if (!res.ok) throw new Error(`${WASM_URL} HTTP ${res.status}. 先に \`almide build src/eq.almd --target wasm -o dist/headset_eq.wasm\` を実行。`);
  const bytes = await res.arrayBuffer();
  const wasi = { fd_write: () => 0, proc_exit: () => {} };
  const { instance } = await WebAssembly.instantiate(bytes, { wasi_snapshot_preview1: wasi });
  const ex = instance.exports;
  if (typeof ex._start === 'function') { try { ex._start(); } catch (_) {} }
  const n = Number(ex.num_bands()), out = [];
  for (let b=0;b<n;b++){ const c=[0,1,2,3,4].map(k=>ex.band_coeff(BigInt(b),BigInt(k))); out.push({b0:c[0],b1:c[1],b2:c[2],a1:c[3],a2:c[4]}); }
  return out;
}

$('#beep').onclick = beep;
$('#tone').onclick = playTone;
$('#noise').onclick = playNoise;
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && playFile(e.target.files[0]);
$('#stop').onclick = () => { stop(); log('停止'); };
$('#eq').onclick = () => { eqOn = !eqOn; const b=$('#eq'); b.textContent='EQ: '+(eqOn?'ON':'OFF'); b.classList.toggle('on',eqOn);
  if (source) { try { source.disconnect(); } catch(_){} connectGraph(source); } };

log('page loaded. STEP 1 のビープテストを押してください。');
try {
  coeffs = await loadCoeffs();
  log(`wasm OK: ${coeffs.length} バンドの係数を取得`, 'ok');
  drawResponse(); showCoeffs();
} catch (e) { log('wasm load failed: ' + e.message, 'err'); }
</script>
</body>
</html>
